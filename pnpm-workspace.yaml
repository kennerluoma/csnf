packages:
  - admin
allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Supply chain: never install a version published less than 7 days ago (most malicious releases are
# pulled within days). Security fixes that can't wait: add the package to minimumReleaseAgeExclude
# for that one update, then remove it.
minimumReleaseAge: 10080

# Patched versions forced onto transitive dependencies that `pnpm audit` flagged. Remove an entry
# once the parent package depends on a fixed version itself.
overrides:
  js-yaml@<3.15.2: ^3.15.2
  smol-toml@<1.7.1: ^1.7.1
  adm-zip@<0.6.1: ^0.6.1
