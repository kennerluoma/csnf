name: Deploy
# main → production deploy. Any other branch → versioned preview URL aliased to the branch name.
#
# Until the first design build is merged (no design/mapping.json on main) the production deploy
# publishes tools/placeholder-worker.js instead of the site: a 503 "being built" page under the
# same Worker name. A visitor never sees the unbuilt template, and the Worker still exists, which
# is what `wrangler versions upload` needs for PR previews.
on:
  push:
  workflow_dispatch:
  # exhibitionList/eventCalendar bake "current"/"upcoming"/today's cell into prerendered HTML and
  # static-data at build time; nothing else invalidates them, so a site with no edits for a few
  # weeks would keep showing a finished exhibition as current. Rebuilding daily keeps them fresh.
  schedule:
    - cron: '5 0 * * *'

concurrency:
  group: deploy-${{ github.ref }}
  # The content webhook dispatches this on every Sanity publish, so two edits a minute apart on
  # main could cancel a run mid-deploy (between "Deploy production" and "Worker secrets" or
  # "Deploy admin", or mid wrangler deploy) — a site live without its secrets, or a stale admin.
  # Previews (any other ref) still cancel: only the newest preview for a branch is worth keeping.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    # Dependabot PRs get no secrets, so they can't deploy a preview; CI still builds and checks them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Not VITE_SANITY_PROJECT_ID directly: Vite gives process.env priority over .env.production
      # regardless of value, so setting it to '' when the secret is unset would blank out the
      # committed .env.production id instead of falling back to it. Exported as VITE_ only when
      # non-empty, right before the Build step below.
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      VITE_SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
      # Public (a site key, not the secret): inlined at build time by Vite, so the prerendered
      # contact page (and the deployed Worker bundle, which is the same build output) has it —
      # unlike TURNSTILE_SECRET_KEY below, which only reaches the Worker as a secret afterwards.
      VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v7

      # A widget that never renders (no site key at build) still gets every submission bounced by
      # the Worker's secret-key check, so this must fail loudly rather than ship a broken form.
      - name: Turnstile configuration check
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [ -n "$TURNSTILE_SECRET_KEY" ] && [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "TURNSTILE_SECRET_KEY is set but the TURNSTILE_SITE_KEY repository variable is not." >&2
            echo "The contact form would verify against a widget that never renders, so every submission would fail. Set the TURNSTILE_SITE_KEY repository variable (Settings → Secrets and variables → Actions → Variables)." >&2
            exit 1
          fi

      # design/mapping.json is written by the build agent and lands on main with the first merged
      # build PR. `worker` is the Worker name provisioning wrote into wrangler.jsonc.
      - name: Is the design built?
        id: site
        run: |
          if [ -f design/mapping.json ]; then built=true; else built=false; fi
          worker=$(sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' wrangler.jsonc | head -1)
          # The name reaches a shell as a wrangler argument below; keep it to what a Worker name can be.
          case "$worker" in
            "" | *[!a-z0-9-]*) echo "wrangler.jsonc has no usable worker name: '$worker'" >&2; exit 1 ;;
          esac
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "worker $worker · built $built"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Not built yet: the only thing that ships is the placeholder. No site build, no Worker
      # secrets, no admin — the admin needs the schema the build produces.
      - name: Deploy placeholder (design not built yet)
        if: github.ref == 'refs/heads/main' && steps.site.outputs.built == 'false'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --name ${{ steps.site.outputs.worker }} --config tools/placeholder.wrangler.jsonc

      - name: Build
        if: github.ref != 'refs/heads/main' || steps.site.outputs.built == 'true'
        run: |
          [ -n "$SANITY_PROJECT_ID" ] && export VITE_SANITY_PROJECT_ID="$SANITY_PROJECT_ID"
          pnpm build

      - name: Deploy production
        if: github.ref == 'refs/heads/main' && steps.site.outputs.built == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      - name: Worker secrets (contact form)
        if: github.ref == 'refs/heads/main' && steps.site.outputs.built == 'true'
        # Only the secrets that are set; wrangler refuses empty values. TURNSTILE_SITE_KEY is
        # public and already baked into the build (VITE_TURNSTILE_SITE_KEY above) — it doesn't
        # need to also be a Worker secret.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          node -e '
            const names = ["SANITY_WRITE_TOKEN","RESEND_API_KEY","CONTACT_FROM","TURNSTILE_SECRET_KEY"];
            const out = Object.fromEntries(names.filter(n => process.env[n]).map(n => [n, process.env[n]]));
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("secrets:", Object.keys(out).join(", ") || "(none set)");
          '
          if [ "$(node -e 'console.log(Object.keys(require("./secrets.json")).length)')" != "0" ]; then
            pnpm exec wrangler secret bulk secrets.json
          fi
          rm -f secrets.json

      - name: Build admin
        if: github.ref == 'refs/heads/main' && steps.site.outputs.built == 'true'
        # The site build leaves .wrangler/deploy/config.json in the root, which wrangler
        # would otherwise pick up from the admin directory and refuse to deploy.
        run: rm -rf .wrangler && pnpm build:admin
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET || 'production' }}

      - name: Deploy admin
        if: github.ref == 'refs/heads/main' && steps.site.outputs.built == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: admin
          command: deploy --config wrangler.jsonc

      # What the admin's "Register Studio" button does besides adding a CORS origin (which
      # provisioning already does): push the studio's schema + manifest into the dataset, so
      # schema-aware search and the other features that read the deployed schema work without
      # anyone clicking anything. It regenerates the manifest itself; no separate extract step.
      #
      # continue-on-error on purpose: this is an admin nicety, and a token or API problem here
      # must never turn a client's site deploy red. A failure still shows up on the run.
      - name: Register admin schema with Sanity
        if: github.ref == 'refs/heads/main' && steps.site.outputs.built == 'true'
        continue-on-error: true
        working-directory: admin
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
        run: pnpm exec sanity schemas deploy

      - name: Preview alias from branch name
        if: github.ref != 'refs/heads/main'
        id: alias
        # github.ref_name goes through `env`, not string-interpolated into the script: a branch
        # name like `x'; curl ...; '` would otherwise close the quote GitHub Actions inserts and
        # run arbitrary shell in a job that holds CF_API_TOKEN.
        env:
          REF: ${{ github.ref_name }}
        run: echo "alias=$(echo "$REF" | tr '/_' '--' | tr -cd 'a-zA-Z0-9-' | cut -c1-28 | tr 'A-Z' 'a-z' | sed 's/^-*//; s/-*$//')" >> "$GITHUB_OUTPUT"

      - name: Upload preview version
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.alias }}
