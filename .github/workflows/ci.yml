name: CI
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the visual-check comment
    env:
      # Prerendering reads the (public) dataset at build time. The id normally comes from the
      # committed .env.production; the secret, when present, wins (Dependabot PRs get no secrets).
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Generated Sanity types are committed and must be current (reads .env.production; no secrets).
      - run: pnpm typegen
      - run: git diff --exit-code src/sanity/queries.gen.ts src/sanity/sanity.types.ts
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: |
          [ -n "$SANITY_PROJECT_ID" ] && export VITE_SANITY_PROJECT_ID="$SANITY_PROJECT_ID"
          pnpm build
      # "Instant" is checked: JS size, and clicks that make no document or server-function request.
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm budget
      # The built pages next to the design renders. Words, not gates: this step cannot fail the
      # build, and a .fig import (no renders) simply reports "no reference" everywhere.
      - name: Visual check
        continue-on-error: true # a crash in the report must not block a client's PR
        run: pnpm visual
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual
          path: |
            design/shots
            design/visual
            design/visual-report.md
          if-no-files-found: ignore
      - name: Visual check comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types scripts/visual-comment.ts
      - run: pnpm audit --prod --audit-level high
