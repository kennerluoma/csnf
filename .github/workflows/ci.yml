name: CI
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Prerendering reads the (public) dataset at build time. The id normally comes from the
      # committed .env.production; the secret, when present, wins (Dependabot PRs get no secrets).
      SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Generated Sanity types are committed and must be current (reads .env.production; no secrets).
      - run: pnpm typegen
      - run: git diff --exit-code src/sanity/queries.gen.ts src/sanity/sanity.types.ts
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: |
          [ -n "$SANITY_PROJECT_ID" ] && export VITE_SANITY_PROJECT_ID="$SANITY_PROJECT_ID"
          pnpm build
      # "Instant" is checked: JS size, and clicks that make no document or server-function request.
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm budget
      - run: pnpm audit --prod --audit-level high
