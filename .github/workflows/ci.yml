name: CI
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Prerendering reads the (public) dataset at build time, so CI needs the real project id.
      VITE_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
      VITE_SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # "Instant" is checked: JS size, and clicks that make no document or server-function request.
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm budget
      - run: pnpm audit --prod --audit-level high
